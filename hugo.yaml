baseURL: https://2ruman.github.io/
locale: en-us
title: Truman
hasCJKLanguage: true
enableGitInfo: true
enableRobotsTXT: true

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: Blog
      pageRef: /blog
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search
    - name: GitHub
      weight: 4
      url: https://github.com/2ruman
      params:
        icon: github
    - name: Theme Toggle
      weight: 5
      params:
        type: theme-toggle
        label: false # optional, default is false

params:
  description: "Practical notes from an Android engineer — and a few warm ones from everyday life."

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
      width: 22
      height: 22

  theme:
    default: system
    displayToggle: false # the toggle already lives in the navbar menu

  footer:
    displayCopyright: true
    displayPoweredBy: true

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  editURL:
    enable: true
    base: https://github.com/2ruman/2ruman.github.io/edit/main/content

  blog:
    list:
      displayTags: true
      sortBy: date
      sortOrder: desc
  toc:
    displayTags: true
